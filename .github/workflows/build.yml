#include <nds.h>
#include <gl2d.h>
#include <stdio.h>

int main() {

    lcdMainOnTop();

    // Ecran du haut en 3D/2D
    videoSetMode(MODE_0_3D);
    glScreen2D();

    int x = 120;
    int y = 100;
    int ballX = 150;
    int ballY = 100;
    int score = 0;

    while (pmMainLoop()) {

        scanKeys();

        int held = keysHeld();
        int down = keysDown();

        // Déplacement du joueur
        if (held & KEY_LEFT)  x -= 2;
        if (held & KEY_RIGHT) x += 2;
        if (held & KEY_UP)    y -= 2;
        if (held & KEY_DOWN)  y += 2;

        if (x < 15) x = 15;
        if (x > 230) x = 230;
        if (y < 25) y = 25;
        if (y > 155) y = 155;

        // Tir normal
        if ((down & KEY_A) &&
            ballX > x - 30 &&
            ballX < x + 30 &&
            ballY > y - 30 &&
            ballY < y + 30) {

            ballX += 12;

            if (ballX > 250) {
                ballX = 150;
                score++;
            }
        }

        // ICE STORM
        if ((down & KEY_X)) {
            ballX += 30;

            if (ballX > 250) {
                ballX = 150;
                score++;
            }
        }

        // Fond vert
        glClearColor(5, 20, 5, 31);

        glBegin2D();

        // Terrain
        glBoxFilled(0, 0, 255, 191, RGB15(8, 24, 8));

        // Lignes du terrain
        glLine(8, 8, 247, 8, RGB15(31,31,31));
        glLine(8, 183, 247, 183, RGB15(31,31,31));
        glLine(8, 8, 8, 183, RGB15(31,31,31));
        glLine(247, 8, 247, 183, RGB15(31,31,31));
        glLine(127, 8, 127, 183, RGB15(31,31,31));

        // But
        glBoxFilled(242, 70, 250, 120, RGB15(31,31,31));

        // Joueur n°10
        glBoxFilled(x-8, y-25, x+8, y-10, RGB15(31,31,31));
        glBoxFilled(x-7, y-10, x+7, y+5, RGB15(31,31,31));
        glBoxFilled(x-11, y+5, x+11, y+20, RGB15(5,12,28));

        // Cheveux blancs
        glTriangleFilled(
            x, y-35,
            x-12, y-22,
            x+12, y-22,
            RGB15(31,31,31)
        );

        // Yeux rouges
        glBoxFilled(x-6, y-16, x-3, y-13, RGB15(31,0,0));
        glBoxFilled(x+3, y-16, x+6, y-13, RGB15(31,0,0));

        // Jambes
        glBoxFilled(x-7, y+20, x-2, y+35, RGB15(31,31,31));
        glBoxFilled(x+2, y+20, x+7, y+35, RGB15(31,31,31));

        // Ballon
        glBoxFilled(
            ballX-5,
            ballY-5,
            ballX+5,
            ballY+5,
            RGB15(31,31,31)
        );

        // Adversaire
        glBoxFilled(195, 60, 207, 75, RGB15(31,0,0));
        glBoxFilled(192, 75, 210, 95, RGB15(20,5,5));
        glBoxFilled(195, 95, 200, 110, RGB15(31,31,31));
        glBoxFilled(202, 95, 207, 110, RGB15(31,31,31));

        glEnd2D();

        glFlush(0);

        swiWaitForVBlank();
    }

    return 0;
}
