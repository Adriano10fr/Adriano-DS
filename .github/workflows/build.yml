name: Build Adriano DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Creer le prototype
        run: |
          rm -rf source build Makefile
          mkdir -p source

          cat > source/main.cpp <<'EOF'
          #include <nds.h>
          #include <stdio.h>

          int main(void)
          {
              consoleDemoInit();

              iprintf("\x1b[2J");
              iprintf("\x1b[3;5HADRIANO DS");
              iprintf("\x1b[5;3H================");
              iprintf("\x1b[7;4HPROTOTYPE FOOTBALL");
              iprintf("\x1b[10;5HNOUVELLE PARTIE");
              iprintf("\x1b[12;4HAppuie sur A");
              iprintf("\x1b[15;4HAdriano - N°10");
              iprintf("\x1b[16;4HElement : GLACE");

              while (pmMainLoop())
              {
                  scanKeys();

                  int pressed = keysDown();

                  if (pressed & KEY_A)
                  {
                      consoleClear();

                      iprintf("\x1b[3;5HADRIANO");
                      iprintf("\x1b[5;3H================");
                      iprintf("\x1b[7;5HNUMERO 10");
                      iprintf("\x1b[9;3HELEMENT : GLACE");
                      iprintf("\x1b[12;3HTECHNIQUE :");
                      iprintf("\x1b[14;4HECLAT POLAIRE");
                      iprintf("\x1b[18;3HPrototype DS OK !");
                  }

                  if (pressed & KEY_B)
                  {
                      consoleClear();

                      iprintf("\x1b[3;5HADRIANO DS");
                      iprintf("\x1b[7;4HNOUVELLE PARTIE");
                      iprintf("\x1b[10;4HAppuie sur A");
                  }

                  swiWaitForVBlank();
              }

              return 0;
          }
          EOF

          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/nds-examples
          cp /tmp/nds-examples/templates/arm9/Makefile Makefile

          sed -i 's/^TARGET :=.*/TARGET := Adriano-DS/' Makefile
          sed -i 's/^SOURCES :=.*/SOURCES := source/' Makefile

          make

          test -s Adriano-DS.nds

      - name: Recuperer le NDS
        uses: actions/upload-artifact@v4
        with:
          name: AdrianoDS
          path: Adriano-DS.nds
