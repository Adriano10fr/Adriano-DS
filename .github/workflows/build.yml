name: Adriano DS - Test Graphique

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Creer le projet
        shell: bash
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/nds-examples
          mkdir -p source
          cp /tmp/nds-examples/templates/arm9/Makefile Makefile
          sed -i 's/^TARGET.*/TARGET := Adriano-DS/' Makefile
          sed -i 's/^SOURCES.*/SOURCES := source/' Makefile

          cat > source/main.cpp <<'EOF'
          #include <nds.h>

          int x = 128;
          int y = 96;

          void draw()
          {
              u16* v = bgGetGfxPtr(0);

              for (int yy = 0; yy < 192; yy++)
              {
                  for (int xx = 0; xx < 256; xx++)
                  {
                      int r = 50;
                      int g = 150;
                      int b = 70;

                      if ((xx / 16) % 2 == 0)
                          g = 160;

                      v[xx + yy * 256] =
                          RGB15(r >> 3, g >> 3, b >> 3) | BIT(15);
                  }
              }

              for (int yy = y - 12; yy < y + 12; yy++)
              {
                  for (int xx = x - 8; xx < x + 8; xx++)
                  {
                      if (xx >= 0 && xx < 256 && yy >= 0 && yy < 192)
                      {
                          v[xx + yy * 256] =
                              RGB15(245 >> 3, 245 >> 3, 250 >> 3) | BIT(15);
                      }
                  }
              }

              for (int yy = y - 25; yy < y - 12; yy++)
              {
                  for (int xx = x - 9; xx < x + 9; xx++)
                  {
                      if (xx >= 0 && xx < 256 && yy >= 0 && yy < 192)
                      {
                          v[xx + yy * 256] =
                              RGB15(245 >> 3, 245 >> 3, 250 >> 3) | BIT(15);
                      }
                  }
              }

              for (int yy = y - 5; yy < y + 3; yy++)
              {
                  for (int xx = x - 5; xx < x + 5; xx++)
                  {
                      if (xx >= 0 && xx < 256 && yy >= 0 && yy < 192)
                      {
                          v[xx + yy * 256] =
                              RGB15(240 >> 3, 175 >> 3, 130 >> 3) | BIT(15);
                      }
                  }
              }

              for (int yy = y + 3; yy < y + 20; yy++)
              {
                  for (int xx = x - 8; xx < x + 8; xx++)
                  {
                      if (xx >= 0 && xx < 256 && yy >= 0 && yy < 192)
                      {
                          v[xx + yy * 256] =
                              RGB15(235 >> 3, 245 >> 3, 255 >> 3) | BIT(15);
                      }
                  }
              }
          }

          int main()
          {
              videoSetMode(MODE_5_2D);
              videoSetModeSub(MODE_5_2D);

              vramSetBankA(VRAM_A_MAIN_BG);
              vramSetBankC(VRAM_C_SUB_BG);

              int bg = bgInit(
                  3,
                  BgType_Bmp16,
                  BgSize_B16_256x256,
                  0,
                  0
              );

              int sub = bgInitSub(
                  3,
                  BgType_Bmp16,
                  BgSize_B16_256x256,
                  0,
                  0
              );

              while (1)
              {
                  scanKeys();

                  int keys = keysHeld();

                  if (keys & KEY_LEFT)
                      x -= 2;

                  if (keys & KEY_RIGHT)
                      x += 2;

                  if (keys & KEY_UP)
                      y -= 2;

                  if (keys & KEY_DOWN)
                      y += 2;

                  if (x < 15)
                      x = 15;

                  if (x > 240)
                      x = 240;

                  if (y < 35)
                      y = 35;

                  if (y > 160)
                      y = 160;

                  draw();

                  u16* subScreen = bgGetGfxPtr(sub);

                  for (int yy = 0; yy < 192; yy++)
                  {
                      for (int xx = 0; xx < 256; xx++)
                      {
                          subScreen[xx + yy * 256] =
                              RGB15(20 >> 3, 35 >> 3, 65 >> 3) | BIT(15);
                      }
                  }

                  swiWaitForVBlank();
              }

              return 0;
          }
          EOF

      - name: Compiler
        shell: bash
        run: |
          make

      - name: Recuperer la ROM
        uses: actions/upload-artifact@v4
        with:
          name: Adriano-DS-Test
          path: Adriano-DS.nds
