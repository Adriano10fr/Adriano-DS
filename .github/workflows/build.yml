name: Build Adriano DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Construire
        run: |
          mkdir -p source

          cat > source/main.cpp <<'EOF'
          #include <nds.h>
          #include <stdio.h>

          int main(void)
          {
              consoleDemoInit();

              while (pmMainLoop())
              {
                  scanKeys();

                  consoleClear();

                  iprintf("\n\n");
                  iprintf("================================\n");
                  iprintf("        ADRIANO DS\n");
                  iprintf("================================\n\n");
                  iprintf("      PROTOTYPE FOOTBALL\n\n");
                  iprintf("      NUMERO 10\n");
                  iprintf("      ELEMENT : GLACE\n\n");
                  iprintf("      ECLAT POLAIRE\n\n");
                  iprintf("================================\n");
                  iprintf("      A : CONTINUER\n");
                  iprintf("================================\n");

                  swiWaitForVBlank();
              }

              return 0;
          }
          EOF

          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/nds-examples
          cp /tmp/nds-examples/hello_world/Makefile Makefile

          sed -i 's/^TARGET :=.*/TARGET := Adriano-DS/' Makefile
          sed -i 's/^SOURCES :=.*/SOURCES := source/' Makefile

          make

          test -s Adriano-DS.nds

      - name: Recuperer le NDS
        uses: actions/upload-artifact@v4
        with:
          name: AdrianoDS
          path: Adriano-DS.nds
