name: Build Adriano DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Préparer le projet
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git
          cp nds-examples/templates/arm9/Makefile Makefile
          mkdir -p source
          sed -i 's/^TARGET.*/TARGET := Adriano-DS/' Makefile
          sed -i 's/^SOURCES.*/SOURCES := source/' Makefile

      - name: Créer le jeu
        run: |
          cat > source/main.cpp <<'EOF'
          #include <nds.h>
          #include <stdio.h>

          int main() {
              consoleDemoInit();

              int joueurX = 10;
              int joueurY = 10;
              int ballonX = 15;
              int ballonY = 10;
              int score = 0;

              iprintf("\x1b[1;1H================================");
              iprintf("\x1b[2;1H        ADRIANO DS");
              iprintf("\x1b[3;1H================================");

              iprintf("\x1b[5;1HJOUEUR PRINCIPAL");
              iprintf("\x1b[6;1HN°10  FW  GLACE");
              iprintf("\x1b[7;1H");

              iprintf("\x1b[9;1H-------------------------------");
              iprintf("\x1b[10;1H|                             |");
              iprintf("\x1b[11;1H|          ⚽                  |");
              iprintf("\x1b[12;1H|                             |");
              iprintf("\x1b[13;1H|              X              |");
              iprintf("\x1b[14;1H|                             |");
              iprintf("\x1b[15;1H|                             |");
              iprintf("\x1b[16;1H-------------------------------");

              iprintf("\x1b[18;1HA = TIR");
              iprintf("\x1b[19;1HX = ICE STORM");
              iprintf("\x1b[20;1HCROIX = DEPLACEMENT");

              while (pmMainLoop()) {
                  scanKeys();

                  int held = keysHeld();
                  int down = keysDown();

                  if (held & KEY_LEFT)
                      joueurX--;

                  if (held & KEY_RIGHT)
                      joueurX++;

                  if (held & KEY_UP)
                      joueurY--;

                  if (held & KEY_DOWN)
                      joueurY++;

                  if (joueurX < 0)
                      joueurX = 0;

                  if (joueurX > 20)
                      joueurX = 20;

                  if (joueurY < 0)
                      joueurY = 0;

                  if (joueurY > 10)
                      joueurY = 10;

                  if (down & KEY_A) {
                      ballonX += 3;

                      if (ballonX > 25) {
                          ballonX = 15;
                          score++;
                      }
                  }

                  if (down & KEY_X) {
                      iprintf("\x1b[22;1H*** ICE STORM !!! ***");
                      ballonX += 6;

                      if (ballonX > 25) {
                          ballonX = 15;
                          score++;
                      }
                  }

                  iprintf("\x1b[24;1HSCORE : %d    ", score);

                  swiWaitForVBlank();
              }

              return 0;
          }
          EOF

      - name: Compiler
        run: |
          make -j2

      - name: Vérifier le NDS
        run: |
          test -s Adriano-DS.nds
          ls -lh Adriano-DS.nds

      - name: Télécharger le build
        uses: actions/upload-artifact@v4
        with:
          name: AdrianoDS
          path: Adriano-DS.nds
