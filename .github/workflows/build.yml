name: Build Adriano DS

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Recuperer le Makefile officiel devkitPro
        run: |
          git clone --depth 1 https://github.com/devkitPro/nds-examples.git /tmp/nds-examples
          cp /tmp/nds-examples/hello_world/Makefile ./Makefile

      - name: Creer le jeu
        run: |
          mkdir -p source

          cat > source/main.cpp <<'EOF'
          #include <nds.h>
          #include <stdio.h>

          int main(void)
          {
              consoleDemoInit();

              bool started = false;

              while (pmMainLoop())
              {
                  scanKeys();

                  int pressed = keysDown();

                  consoleClear();

                  iprintf("\n\n");
                  iprintf("       ADRIANO DS\n");
                  iprintf("\n");
                  iprintf("    FOOTBALL PROJECT\n");
                  iprintf("\n\n");

                  if (!started)
                  {
                      iprintf("    NOUVELLE PARTIE\n");
                      iprintf("\n");
                      iprintf("    Appuie sur A");
                  }
                  else
                  {
                      iprintf("    ADRIANO\n");
                      iprintf("\n");
                      iprintf("    NUMERO 10\n");
                      iprintf("\n");
                      iprintf("    ELEMENT : GLACE\n");
                      iprintf("\n");
                      iprintf("    ECLAT POLAIRE\n");
                      iprintf("\n");
                      iprintf("    Prototype DS");
                  }

                  if (pressed & KEY_A)
                      started = true;

                  swiWaitForVBlank();
              }

              return 0;
          }
          EOF

      - name: Compiler le NDS
        run: make

      - name: Verifier le NDS
        run: test -s Adriano-DS.nds

      - name: Recuperer le NDS
        uses: actions/upload-artifact@v4
        with:
          name: AdrianoDS
          path: Adriano-DS.nds
